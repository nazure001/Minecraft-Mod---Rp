# Gradle JVM args
org.gradle.jvmargs=-Xmx2G
# org.gradle.java.home — set di ~/.gradle/gradle.properties lokal (tidak di-commit)
# Loom 1.19.3 membutuhkan JVM 25+ untuk menjalankan Gradle.
# Unduh Eclipse Temurin 25 dari https://adoptium.net/temurin/releases/?version=25
# Tambahkan ke ~/.gradle/gradle.properties:
#   org.gradle.java.home=<path-ke-jdk-25>
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric — versions from https://github.com/FabricMC/fabric-example-mod/tree/1.21.1
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.20.1
loom_version=1.19.3

# Mod
mod_version=0.1.0-alpha
maven_group=com.avatarmod
archives_base_name=avatar-elements

# [PLACEHOLDER] Update mod_id if renamed — see docs/DECISIONS.md D009
mod_id=avatar_elements

# Dependencies
fabric_api_version=0.116.17+1.21.1
