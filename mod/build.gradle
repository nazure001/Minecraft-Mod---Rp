plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    // Fabric maven is added automatically by Loom
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def propModId = project.mod_id
    def propVersion = project.mod_version
    def propMinecraft = project.minecraft_version
    def propLoader = project.loader_version
    def propFabricApi = project.fabric_api_version

    inputs.property "mod_id", propModId
    inputs.property "version", propVersion
    inputs.property "minecraft_version", propMinecraft
    inputs.property "loader_version", propLoader
    inputs.property "fabric_api_version", propFabricApi

    filesMatching("fabric.mod.json") {
        expand(
            "mod_id": propModId,
            "version": propVersion,
            "minecraft_version": propMinecraft,
            "loader_version": propLoader,
            "fabric_api_version": propFabricApi
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    inputs.property "archivesBaseName", project.archives_base_name
    archiveBaseName = project.archives_base_name

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
